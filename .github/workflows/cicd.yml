name: CI/CD

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'EC2 배포 실행 여부'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# 워크플로우 기본 최소 권한 — CD job만 packages: write 승격
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: booktown/booktown-backend-v2

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 테스트 실행
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Docker 이미지 빌드 (smoke check)
        if: github.event_name == 'pull_request'
        run: docker build -t booktown-backend:ci-check .

  cd:
    name: Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: ((github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 메타데이터 추출
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -euo pipefail
            cd /opt/booktown

            NEW_TAG="${{ steps.meta.outputs.version }}"
            PREVIOUS_IMAGE=$(sudo docker compose -f compose.prod.yaml ps -q backend \
              | xargs -r sudo docker inspect --format='{{.Config.Image}}' 2>/dev/null || true)
            if [ -z "$PREVIOUS_IMAGE" ]; then
              PREVIOUS_IMAGE="none"
            fi

            echo "이전 이미지: $PREVIOUS_IMAGE"
            echo "새 이미지 태그: $NEW_TAG"

            echo "새 이미지 풀링 중..."
            sudo env IMAGE_TAG="$NEW_TAG" docker compose -f compose.prod.yaml pull backend

            echo "컨테이너 교체 중..."
            sudo env IMAGE_TAG="$NEW_TAG" docker compose -f compose.prod.yaml up -d --no-deps backend

            echo "Readiness 확인 중..."
            RETRIES=12
            INTERVAL=10
            for i in $(seq 1 $RETRIES); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.booktown.shop/api/v1/health/readiness || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Readiness 확인 성공 (시도 $i)"
                break
              fi
              if [ "$i" = "$RETRIES" ]; then
                echo "❌ Readiness 확인 실패 — 롤백 시작"
                if [ "$PREVIOUS_IMAGE" != "none" ]; then
                  PREVIOUS_TAG="${PREVIOUS_IMAGE##*:}"
                  sudo env IMAGE_TAG="$PREVIOUS_TAG" docker compose -f compose.prod.yaml up -d --no-deps backend
                fi
                exit 1
              fi
              echo "시도 $i/$RETRIES 실패 (HTTP $STATUS), ${INTERVAL}초 후 재시도..."
              sleep $INTERVAL
            done

            echo "🧹 오래된 이미지 정리 중..."
            sudo docker image prune -f
